<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
    body, html { width:100%; height:100%; background: linear-gradient(135deg, #ffffff, #d3d3d3); display:flex; justify-content:center; align-items:center; overflow:hidden; }

    .container { text-align:center; color:#333; }

    /* Logo */
    .logo { width:120px; margin-bottom:30px; animation: logoAnim 2s ease-in-out infinite alternate; }
    @keyframes logoAnim {
        0% { transform: scale(1); }
        50% { transform: scale(1.1) rotate(5deg); }
        100% { transform: scale(1); }
    }

    /* Coming Soon Text */
    h1 { font-size:3em; margin-bottom:20px; letter-spacing:2px; animation: fadeIn 2s ease forwards; opacity:0; }
    @keyframes fadeIn { to { opacity:1; } }

    /* Loading Animation */
    .loader {
        display:flex; justify-content:center; margin-top:30px;
    }
    .loader div {
        width:15px; height:15px; background:#333; margin:0 5px; border-radius:50%; animation: bounce 0.6s infinite alternate;
    }
    .loader div:nth-child(2) { animation-delay:0.2s; }
    .loader div:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-20px); }
    }

    /* Notification */
    .notification {
        position:fixed;
        top:20px;
        right:20px;
        background: rgba(0,0,0,0.05);
        border-left:4px solid #333;
        padding:15px 25px;
        border-radius:8px;
        color:#333;
        font-weight:500;
        box-shadow:0 0 15px rgba(0,0,0,0.1);
        opacity:0;
        transform: translateX(100%);
        animation: slideIn 1s forwards 1s, fadeOut 1s forwards 6s;
    }
    @keyframes slideIn {
        to { opacity:1; transform: translateX(0); }
    }
    @keyframes fadeOut {
        to { opacity:0; transform: translateX(100%); }
    }
</style>
</head>
<body>

<div class="container">
    <!-- Replace the src with your logo -->
    <img src="https://media.discordapp.net/attachments/1446236349693956199/1446501806917025994/3dgifmaker83065.gif?ex=6934e009&is=69338e89&hm=eba31a425741a94f0ba16f790bf5ee77296b1eabb46322fe78e37f6418c8bad0&=" alt="Logo" class="logo">

    <h1>Coming Soon</h1>

    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

<div class="notification">
    Welcome! Our website is coming soon 🚀
</div>

</body>
</html>
