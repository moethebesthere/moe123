<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
    html, body { width:100%; height:100%; overflow:hidden; background: linear-gradient(135deg, #e0e0e0, #b0b0b0); display:flex; justify-content:center; align-items:center; }

    .container { text-align:center; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }

    /* Logo */
    .logo { width:200px; margin-bottom:20px; animation: logoAnim 2s ease-in-out infinite alternate; transition: transform 0.3s; }
    .logo:hover { transform: scale(1.1) rotate(5deg); }
    @keyframes logoAnim { 0% { transform: scale(1); } 50% { transform: scale(1.05) rotate(3deg); } 100% { transform: scale(1); } }

    /* Countdown */
    .countdown {
        display:flex;
        justify-content:center;
        gap:8px;
        backdrop-filter: blur(12px);
        background: rgba(255,255,255,0.2);
        padding:15px 20px;
        border-radius:15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        color:#333;
        font-weight:700;
        font-size:1.5em;
        letter-spacing:1px;
        flex-wrap:wrap;
    }
    .countdown div { text-align:center; display:flex; flex-direction:column; min-width:55px; }
    .countdown div span { font-size:2em; font-weight:800; animation: pulse 1s infinite alternate; }
    .colon { font-size:2em; font-weight:800; align-self:center; animation: pulse 1s infinite alternate; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* Notifications */
    .notification1, .notification2 {
        position:fixed;
        padding:10px 15px;
        border-radius:10px;
        background: rgba(255,255,255,0.25);
        color:#333;
        font-weight:500;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        opacity:0;
        transform: translateX(100%);
        animation: slideIn 1s forwards 1s, fadeOut 1s forwards 10s;
        backdrop-filter: blur(5px);
        border-left:4px solid #333;
        max-width:90%;
        word-wrap: break-word;
    }
    .notification1 { top:10px; right:10px; }
    .notification2 { bottom:10px; right:10px; animation-delay:3s; }

    @keyframes slideIn { to { opacity:1; transform: translateX(0); } }
    @keyframes fadeOut { to { opacity:0; transform: translateX(100%); } }

    /* Responsive for mobile */
    @media (max-width:600px){
        .logo { width:150px; margin-bottom:15px; }
        .countdown { font-size:1.2em; padding:12px 15px; gap:5px; }
        .countdown div span, .colon { font-size:1.5em; }
        .notification1, .notification2 { font-size:0.85em; padding:8px 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <img src="https://media.discordapp.net/attachments/1446236349693956199/1446947120652222577/3dgifmaker34857.gif?ex=6935d604&is=69348484&hm=0bf997ca8e66a92affa4719dd004f008e495b7e39be208d15d119283d9085548&=" alt="Logo" class="logo">

    <div class="countdown" id="countdown">
        <div><span id="days">00</span>Days</div>
        <div class="colon">:</div>
        <div><span id="hours">00</span>Hours</div>
        <div class="colon">:</div>
        <div><span id="minutes">00</span>Minutes</div>
        <div class="colon">:</div>
        <div><span id="seconds">00</span>Seconds</div>
    </div>
</div>

<div class="notification1">Welcome! Our website is launching soon 🚀</div>
<div class="notification2">Thank you for your support ❤️</div>

<script>
    // Countdown setup
    const countdownEndKey = 'countdownEnd';
    let countdownEnd = localStorage.getItem(countdownEndKey);
    if(!countdownEnd){
        countdownEnd = new Date().getTime() + 15*24*60*60*1000;
        localStorage.setItem(countdownEndKey, countdownEnd);
    } else countdownEnd = parseInt(countdownEnd);

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function updateCountdown(){
        const now = new Date().getTime();
        const distance = countdownEnd - now;

        if(distance < 0){
            daysEl.innerHTML = hoursEl.innerHTML = minutesEl.innerHTML = secondsEl.innerHTML = '00';
            localStorage.removeItem(countdownEndKey);
            return;
        }

        const days = Math.floor(distance/(1000*60*60*24));
        const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
        const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
        const seconds = Math.floor((distance % (1000*60))/1000);

        daysEl.innerHTML = days.toString().padStart(2,'0');
        hoursEl.innerHTML = hours.toString().padStart(2,'0');
        minutesEl.innerHTML = minutes.toString().padStart(2,'0');
        secondsEl.innerHTML = seconds.toString().padStart(2,'0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
